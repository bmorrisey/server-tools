# server-tools deployment. See docs/DEPLOY.md for the full walkthrough.
# Run from this directory:
#   cd deploy
#   cp .env.example .env && cp config.example.json config.json   (then edit both)
#   docker compose up -d --build
services:
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Secrets referenced from config.json as ${VAR} come from the .env file
      # next to this compose file (never bake them into the image).
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The toolkit's own config and state.
      - ./config.json:/app/config.json:ro
      - server-tools-data:/data
      # Docker engine access: container checks, in-container backups, deploys.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host disk visibility for "disk" checks (read-only).
      - /:/host:ro
      # Application directories the deploy helper manages (read-write).
      # - /home/you/apps/myapp:/apps/myapp
    ports:
      # Dashboard, bound to localhost only; put your reverse proxy in front.
      - "127.0.0.1:9090:9090"

volumes:
  server-tools-data:
