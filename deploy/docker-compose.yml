# server-tools deployment. See docs/DEPLOY.md for the full walkthrough.
# Run from this directory:
#   cd deploy
#   cp .env.example .env && cp config.example.json config.json   (then edit both)
#   docker compose up -d --build
name: server-tools

services:
  agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      # Secrets referenced from config.json as ${VAR} come from the .env file
      # next to this compose file (never bake them into the image).
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set in .env}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      # Bearer token for an application metrics source, when one is configured.
      APP_METRICS_TOKEN: ${APP_METRICS_TOKEN:-}
      # Connect tokens for /connect data consumers: one line per consumer,
      # matching the entries in .env. A token referenced from config.json but
      # not forwarded here resolves empty, and validation refuses an empty
      # token - so a missing line is a crash loop, not a quiet hole.
      CONNECT_TOKEN_CHARTING: ${CONNECT_TOKEN_CHARTING:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The toolkit's own config and state.
      - ./config.json:/app/config.json:ro
      - server-tools-data:/data
      # Docker engine access: container checks, in-container backups, deploys.
      - /var/run/docker.sock:/var/run/docker.sock
      # Host disk visibility for "disk" checks (read-only).
      - /:/host:ro
      # Application directories the deploy helper manages (read-write).
      # - /home/you/apps/myapp:/apps/myapp
      # Registry credentials for "source": "registry" deploys. "docker login"
      # writes this file on the host; the pull runs in here and needs to read
      # it. Media in a volume or container needs no mount: it is read through
      # the socket above.
      # - /home/you/.docker/config.json:/root/.docker/config.json:ro
    ports:
      # Dashboard, bound to localhost only; put your reverse proxy in front.
      - "127.0.0.1:9090:9090"

volumes:
  server-tools-data:
