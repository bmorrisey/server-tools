name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Syntax check every module
        run: |
          set -e
          for f in $(find src -name '*.js'); do node --check "$f"; done
      - name: Unit tests
        run: node --test
      - name: Validate example config
        run: |
          cp deploy/config.example.json config.json
          node src/cli.js validate
        env:
          SERVER_TOOLS_CONFIG: ./config.json
          BACKUP_PASSPHRASE: ci-only-passphrase-not-real
          S3_ACCESS_KEY_ID: ci-placeholder
          S3_SECRET_ACCESS_KEY: ci-placeholder
          SMTP_PASSWORD: ci-placeholder
